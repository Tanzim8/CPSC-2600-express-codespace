<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Hello Databases!</h1>

    <ul>
        <li><a href="/books">Get All Books</a></li>
        <li><a href="/authors">Get All Authors</a></li>
        <li><a href="/authors?country=Japan">Get All Authors From Japan</a></li>
        <!-- year will be an array with year[0] = 2018 and year[1]=2023 -->
        <li><a href="/books?year=2018&year=2023">Get All Books from 2023 or 2018</a></li>
        <li><a href="/books/17">Get Book with ID=17</a></li>
    </ul>
</body>
</html>
